<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueRoute - Chandigarh Multi-Sector Dispatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 85vh; overflow-y: auto; }
        #map { height: 85vh; width: 100%; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .metric-card { background: #f8f9fa; border-left: 4px solid #1a73e8; padding: 12px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">🚨 RescueRoute: Multi-Sector Chandigarh Dispatch</span>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="sidebar">
                    <h4 class="mb-4 text-primary fw-bold">Dispatch Control Panel</h4>
                    
                    <form id="routeForm">
                        <div class="mb-3">
                            <label for="source" class="form-label fw-semibold">Starting Hub</label>
                            <select class="form-select" id="source" required>
                                <option value="Sector_17" selected>Sector 17 (City Center)</option>
                                <option value="PGI_Hospital">PGI Hospital</option>
                                <option value="Industrial_Area">Industrial Area Phase 1</option>
                                <option value="University_Gate">Panjab University Gate</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="destination" class="form-label fw-semibold">Destination Hub</label>
                            <select class="form-select" id="destination" required>
                                <option value="PGI_Hospital" selected>PGI Hospital</option>
                                <option value="Sector_17">Sector 17 (City Center)</option>
                                <option value="Industrial_Area">Industrial Area Phase 1</option>
                                <option value="University_Gate">Panjab University Gate</option>
                            </select>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="multiSector" checked>
                            <label class="form-check-label fw-semibold text-danger" for="multiSector">
                                Visit ALL Sectors via Shortest Path Tour
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Compute Shortest Route</button>
                    </form>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3">Live Performance Metrics</h5>
                    <div class="metric-card">
                        <small class="text-muted d-block">Total Distance:</small>
                        <span id="metricDistance" class="fw-bold fs-5 text-dark">-- km</span>
                    </div>
                    <div class="metric-card">
                        <small class="text-muted d-block">Estimated Time of Arrival (ETA):</small>
                        <span id="metricEta" class="fw-bold fs-5 text-dark">-- mins</span>
                    </div>
                    <div class="metric-card">
                        <small class="text-muted d-block">Traversal Sequence:</small>
                        <span id="metricStatus" class="fw-semibold text-secondary">Awaiting request...</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([30.7333, 76.7794], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let routeLayer = null;

        document.getElementById('routeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const source = document.getElementById('source').value;
            const destination = document.getElementById('destination').value;
            const multiSector = document.getElementById('multiSector').checked;

            document.getElementById('metricStatus').innerText = "Calculating optimal tour...";

            try {
                const response = await fetch('/calculate_route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source, destination, multi_sector: multiSector, algorithm: 'dijkstra' })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('metricDistance').innerText = data.distance + " km";
                    document.getElementById('metricEta').innerText = data.eta + " mins";
                    document.getElementById('metricStatus').innerText = data.path.join(" ➔ ");

                    if (routeLayer) map.removeLayer(routeLayer);

                    // Google-Maps-styled blue polyline with smooth rounded corners
                    routeLayer = L.polyline(data.coordinates, { 
                        color: '#1a73e8',       // Google Maps blue
                        weight: 6,              // Route line thickness
                        opacity: 0.9,
                        smoothFactor: 1.0,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);

                    map.fitBounds(routeLayer.getBounds());
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                console.error("Connection error:", error);
                alert("Could not connect to Flask backend.");
            }
        });
    </script>
</body>
</html>
