<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Healthcare Queue & Patient Flow</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">🏥 Smart Healthcare Queue System</h3>
                    </div>
                    <div class="card-body">
                        
                        <!-- Patient Check-In Form -->
                        <form id="checkInForm">
                            <div class="mb-3">
                                <label for="patient_id" class="form-label">Select Patient</label>
                                <select class="form-select" id="patient_id" name="patient_id" required>
                                    <option value="" selected disabled>Choose patient...</option>
                                    {% for patient in patients %}
                                        <option value="{{ patient.patient_id }}">{{ patient.first_name }} {{ patient.last_name }} (ID: {{ patient.patient_id }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="department_id" class="form-label">Select Department</label>
                                <select class="form-select" id="department_id" name="department_id" required>
                                    <option value="" selected disabled>Choose department...</option>
                                    {% for dept in departments %}
                                        <option value="{{ dept.department_id }}">{{ dept.department_name }} ({{ dept.room_number }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="priority_score" class="form-label">Priority Score (1: Critical - 5: Routine)</label>
                                <select class="form-select" id="priority_score" name="priority_score" required>
                                    <option value="1">1 - Critical / Emergency</option>
                                    <option value="2">2 - Urgent</option>
                                    <option value="3" selected>3 - Normal</option>
                                    <option value="4">4 - Minor</option>
                                    <option value="5">5 - Routine Checkup</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Check In Patient & Assign Queue</button>
                        </form>

                        <!-- Result Display Area with Correct IDs -->
                        <div id="resultCard" class="mt-4 d-none">
                            <div class="alert alert-success" role="alert">
                                <h4 class="alert-heading">Check-In Successful!</h4>
                                <hr>
                                <p id="resultMessage"></p>
                                <ul class="mb-0">
                                    <li><strong>Appointment ID:</strong> <span id="resAppId"></span></li>
                                    <li><strong>Assigned Doctor ID:</strong> <span id="resDocId"></span></li>
                                    <li><strong>Current Queue Position:</strong> <span id="resPosition"></span></li>
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Handling Form Submission -->
    <script>
        document.getElementById('checkInForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            const response = await fetch('/check-in', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            const resultCard = document.getElementById('resultCard');
            resultCard.classList.remove('d-none');
            
            if(data.status === 'success') {
                document.getElementById('resultMessage').innerText = data.message;
                document.getElementById('resAppId').innerText = data.appointment_id;
                document.getElementById('resDocId').innerText = data.assigned_doctor_id;
                document.getElementById('resPosition').innerText = data.queue_position;
            } else {
                document.getElementById('resultMessage').innerText = "Error: " + data.message;
            }
        });
    </script>
</body>
</html>
